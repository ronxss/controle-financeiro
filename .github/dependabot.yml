# Abre PRs automáticos quando há versão nova (inclui correções de segurança).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/ClientApp"
    schedule:
      interval: weekly
    # Pacotes que dependem uns dos outros (peerDependencies) precisam subir juntos, na mesma PR.
    # Sem isso, o Dependabot atualizava o plugin do Vite sozinho e o npm install quebrava.
    groups:
      vite:
        patterns: ["vite", "@vitejs/*"]
      react:
        patterns: ["react", "react-dom", "react-router-dom"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
